<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Start the connection to Google's sign-in host before the login view mounts. -->
  <link rel="preconnect" href="https://accounts.google.com">
  <script>
    // Paint the stored theme before the first frame; leave <html> bare when the
    // user has never chosen so the stylesheet can follow prefers-color-scheme.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
